[package]
name = "dig-constants"
version = "0.13.0"
edition = "2021"
rust-version = "1.75.0"
description = "DIG network constants — genesis challenge, consensus parameters, and network configuration"
license = "MIT"
authors = ["DIG Network"]
repository = "https://github.com/DIG-Network/dig-constants"

[dependencies]
chia-consensus = "0.36.1"
chia-protocol = "0.36.1"
hex-literal = "0.4"

[dev-dependencies]
sha2 = "0.10"
# Anti-drift KAT only (see tests): pins CHIA_L1_*_AGG_SIG_ME to the same values
# chia-wallet-sdk binds via its MAINNET/TESTNET11 consensus constants. Dev-only
# so dig-constants stays a light leaf with no new runtime dependency.
#
# Pinned to the chia-wallet-sdk 0.36.0 ceiling, NOT the newest on crates.io: the
# SDK cannot reach the 0.48 primitives, so 0.36.0 is the coherent maximum here.
#
# The KAT compares against the DEPENDENCY's MAINNET_CONSTANTS/TESTNET11_CONSTANTS
# rather than a local literal, so on its own it would agree with any self-consistent
# wrong value. What closes that is the absolute literal pinned beside it in
# src/lib.rs -- one side proves we match the SDK, the other proves the SDK's value
# is the real genesis challenge. Neither is sufficient alone; do not delete either
# as redundant. dig_ecosystem#3161.
chia-sdk-types = "0.36.0"
# bech32m decode KAT only (see tests): proves DIG_TREASURY_ADDRESS and
# DIG_TREASURY_INNER_PUZZLE_HASH encode the same recipient. Dev-only so the
# crate stays a light leaf with no new runtime dependency.
bech32 = "0.11"
